[project]
name = "markus-mcp"
version = "0.7.0"
description = "Local Cursor MCP for SAGA WEB and WhatsApp Web automation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.13.0",
  "playwright>=1.49.0",
  "pypdf>=5.0.0",
]

[project.optional-dependencies]
packaging = [
  "pyinstaller>=6.0.0",
]

[project.scripts]
markus-mcp = "markus_mcp.server:main"
markus-mcp-setup = "markus_mcp.bootstrap:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/markus_mcp"]
